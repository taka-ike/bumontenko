<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学内ネットワークからアクセスしてください</title>
  <style>
    /* 外部依存ゼロ（外部CDNなし） */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      background: #f1f5f9;
      color: #1e293b;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-top: 4px solid #b45309;
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 20px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #1e293b;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    footer {
      font-size: 12px;
      color: #475569;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>学内Wi-Fiに接続してください</h1>
    <button onclick="location.reload()">再読み込みする</button>
  </main>
  <footer>学内Wi-Fiに接続してもこの画面が出る場合は、<br>実行局 編集部門3J04にお問い合わせください。</footer>
</body>
</html>
