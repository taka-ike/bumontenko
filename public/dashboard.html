<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本部リアルタイム進捗 - 文化祭部門点呼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    button, input, select, textarea { border-radius: 0; }

    @media (prefers-reduced-motion: no-preference) {
      @keyframes pulse-square {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .live-indicator {
        animation: pulse-square 2.4s ease-in-out infinite;
      }
    }
  </style>
</head>
<body class="bg-neutral-100 text-neutral-900 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    <!-- トップバー -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white border border-neutral-300 p-4 md:p-5">
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center gap-2 px-2.5 py-1 border border-neutral-300 text-xs font-medium text-neutral-700">
            <span class="w-2 h-2 bg-neutral-900 live-indicator"></span> リアルタイム更新中
          </span>
          <span id="sessionStatusBadge" class="text-xs px-2 py-0.5 border border-neutral-300 font-semibold text-neutral-600">
            読み込み中
          </span>
        </div>
        <h1 id="sessionTitle" class="text-xl md:text-2xl font-bold tracking-tight text-neutral-900 mt-2 truncate">
          点呼進捗ダッシュボード
        </h1>
      </div>

      <div class="flex items-center gap-2 w-full md:w-auto">
        <select id="sessionSelector" onchange="changeSession(this.value)" aria-label="表示するセッション" class="flex-1 md:flex-none md:min-w-[220px] bg-white border border-neutral-400 text-neutral-900 text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-neutral-900">
          <option value="">セッション読み込み中...</option>
        </select>
        <button onclick="fetchStats()" aria-label="手動更新" class="px-3 py-2 bg-white border border-neutral-400 hover:bg-neutral-100 text-neutral-900 text-sm font-semibold transition focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-900 focus-visible:ring-offset-2">
          更新
        </button>
        <a href="/tadmin" class="px-3 py-2 bg-neutral-900 hover:bg-neutral-700 text-white text-sm font-semibold transition shrink-0 focus:outline-none focus-visible:ring-2 focus-visible:ring-neutral-900 focus-visible:ring-offset-2">
          管理画面
        </a>
      </div>
    </header>

    <!-- サマリーカード群 -->
    <div class="grid grid-cols-1 gap-3">
      <div class="bg-neutral-900 border border-neutral-900 p-4 md:p-5">
        <p class="text-xs font-medium text-neutral-300">出席</p>
        <p id="presentCount" class="text-3xl md:text-4xl font-bold text-white mt-2 font-mono">0</p>
      </div>
    </div>

    <!-- メインコンテンツグリッド（部門別カード ＆ 最新タイムライン） -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- 部門別進捗カード (2カラム分) -->
      <div class="lg:col-span-2 space-y-3">
        <h2 class="text-base font-bold text-neutral-900">部門別提出状況</h2>
        <div id="deptCardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <p class="text-xs text-neutral-600 py-6">読み込み中...</p>
        </div>
      </div>

      <!-- 最新提出タイムライン (1カラム分) -->
      <div class="bg-white border border-neutral-300 p-4 flex flex-col lg:h-[560px]">
        <h2 class="text-sm font-bold flex items-center justify-between gap-3 pb-3 border-b border-neutral-200">
          <span>最新の受付状況</span>
          <span class="text-xs font-normal text-neutral-600">直近20件</span>
        </h2>
        <div id="timelineContainer" class="flex-1 max-h-[70vh] lg:max-h-none overflow-y-auto pt-3 pr-1 text-xs divide-y divide-neutral-200">
          <p class="text-center text-neutral-600 py-6">読み込み中...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentSessionId = '';
    let eventSource = null;

    const queryParams = new URLSearchParams(window.location.search);
    const dashboardToken = queryParams.get('Token') || queryParams.get('token') || '';

    function withToken(url) {
      if (!dashboardToken) return url;
      const separator = url.includes('?') ? '&' : '?';
      return `${url}${separator}Token=${encodeURIComponent(dashboardToken)}`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[ch]);
    }

    async function fetchStats() {
      try {
        const statsUrl = currentSessionId ? `/api/dashboard/stats?sessionId=${encodeURIComponent(currentSessionId)}` : '/api/dashboard/stats';
        const url = withToken(statsUrl);
        const res = await fetch(url);
        if (!res.ok) throw new Error('統計データの取得失敗');
        const data = await res.json();

        renderDashboard(data);
      } catch (e) {
        console.error(e);
      }
    }

    function renderDashboard(data) {
      if (!data.session) {
        document.getElementById('sessionTitle').textContent = 'セッションがありません';
        const badge = document.getElementById('sessionStatusBadge');
        badge.textContent = '停止中';
        badge.className = 'text-xs px-2 py-0.5 border border-neutral-300 font-semibold bg-neutral-100 text-neutral-600';
        document.getElementById('deptCardsContainer').innerHTML = '<p class="text-xs text-neutral-600 py-6">部門データがありません。</p>';
        document.getElementById('timelineContainer').innerHTML = '<p class="text-xs text-neutral-600 py-6 text-center">セッションが作成されると表示されます。</p>';
        return;
      }

      currentSessionId = data.session.id;
      document.getElementById('sessionTitle').textContent = data.session.name;
      const statusBadge = document.getElementById('sessionStatusBadge');
      if (data.session.status === 'open') {
        statusBadge.textContent = '受付中';
        statusBadge.className = 'text-xs px-2 py-0.5 border border-neutral-900 font-semibold bg-neutral-900 text-white';
      } else {
        statusBadge.textContent = '締切済';
        statusBadge.className = 'text-xs px-2 py-0.5 border border-neutral-300 font-semibold bg-neutral-200 text-neutral-700';
      }

      // セッションセレクタの更新
      const selector = document.getElementById('sessionSelector');
      selector.innerHTML = '';
      for (const s of data.allSessions) {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = `${s.name} (${s.status === 'open' ? '受付中' : '終了'})`;
        if (s.id === data.session.id) opt.selected = true;
        selector.appendChild(opt);
      }

      // 集計カード
      document.getElementById('presentCount').textContent = data.totalSummary.present;

      // 部門別カード
      const deptContainer = document.getElementById('deptCardsContainer');
      deptContainer.innerHTML = '';
      if (data.deptStats.length === 0) {
        deptContainer.innerHTML = '<p class="text-xs text-neutral-600 py-6">部門が登録されていません。</p>';
      }
      for (const dept of data.deptStats) {
        const card = document.createElement('div');
        card.className = 'bg-white border border-neutral-300 p-4';
        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <h3 class="font-semibold text-neutral-900 text-sm">${escapeHtml(dept.name)}</h3>
            <span class="text-base font-mono font-semibold text-neutral-900">出席 ${dept.total}件</span>
          </div>
        `;
        deptContainer.appendChild(card);
      }

      // タイムライン
      const timeline = document.getElementById('timelineContainer');
      timeline.innerHTML = '';
      if (data.recentRecords.length === 0) {
        timeline.innerHTML = '<p class="text-center text-neutral-600 py-6">まだ回答がありません。</p>';
      }
      for (const r of data.recentRecords) {
        const item = document.createElement('div');
        item.className = 'py-3 flex items-center justify-between gap-3';

        const timeStr = new Date(r.submitted_at).toLocaleTimeString('ja-JP');

        item.innerHTML = `
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-mono font-bold text-neutral-900 text-sm">${escapeHtml(r.student_id)}</span>
              <span class="text-neutral-600 truncate">${escapeHtml(r.department_name)}</span>
            </div>
          </div>
          <div class="text-right shrink-0">
            <p class="text-[11px] text-neutral-600 font-mono">${escapeHtml(timeStr)}</p>
          </div>
        `;
        timeline.appendChild(item);
      }
    }

    function changeSession(id) {
      currentSessionId = id;
      fetchStats();
    }

    // SSE接続（リアルタイム更新）
    function initSse() {
      if (eventSource) eventSource.close();
      eventSource = new EventSource(withToken('/api/dashboard/stream'));

      eventSource.addEventListener('attendance', (e) => {
        // 新しい点呼データが送信されたら統計を自動リロード
        fetchStats();
      });

      eventSource.onerror = () => {
        // 切断時は3秒後に再試行
        setTimeout(initSse, 3000);
      };
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchStats();
      initSse();
    });
  </script>
</body>
</html>
